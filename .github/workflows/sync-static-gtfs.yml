name: Sync Static GTFS Schedules

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      agency:
        description: "Optional agency id (guelph, ttc, go, thunderbay); blank for all"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Import static GTFS into Turso/D1 & Cloudflare KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 58300dd8fb7b182e971d4c01b6b99995
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npx tsx infra/seed-static.ts ${{ github.event.inputs.agency }}
